{% extends 'base.html' %}
{% block title %}Sign in | PIMSCO AI{% endblock %}
{% block content %}
<section class="auth-wrap login-wrap">
  <div class="auth-heading"><h1>Welcome Back</h1><p>Sign in to continue to your workspace</p></div>
  <form class="auth-form" method="post" action="{{ url_for('login') }}">
    <label for="mobile">Mobile Number</label>
    <div class="input-shell"><i class="field-icon" data-lucide="phone" aria-hidden="true"></i><input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="07xx xxx xxx" maxlength="10" pattern="0[0-9]{9}" required></div>
    <div class="label-row"><label for="password">Password</label></div>
    <div class="input-shell"><i class="field-icon" data-lucide="lock" aria-hidden="true"></i><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="show-password" type="button" data-toggle-password="password" aria-label="Show password"><i data-lucide="eye" aria-hidden="true"></i></button></div>
    <div class="form-options"><label class="check-line"><input type="checkbox" name="remember"> <span>Remember me</span></label><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
    <button class="primary-button" type="submit">Login</button>
  </form>
  <p class="switch-auth">New member? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
